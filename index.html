<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat House</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header class="game-header">

        <h1> Cat House </h1>

        <div class="stats">

        <div>
            🪙 Coins:
            <span id="coins">500</span>
        </div>

        <div>
            ❤️ Happiness:
            <span id="happiness">0</span>
        </div>

        <div>
            ⭐ Level:
            <span id="level">1</span>
        </div>

        <div class="coin-reward">

            <button id="earn-coins">
                💰 Collect Coins
            </button>

            <button id="restart-game">
                🔄 Restart Game
            </button>

            <span id="pending-coins">
                +0 🪙
            </span>

        </div>

    </div>
    </header>


    <!-- Main Game -->

    <main class="game-container">


    <!-- Cat Room -->

    <section class="room-container">

        <h2>My Cat's Room</h2>

        <div id="room" class="room">

            <div id="cat" class="cat">
                🐱
            </div>

        </div>

    </section>


    <!-- Cat Selection -->

    <section class="cat-selection">

        <h2>🐾 Choose Your Cat</h2>

        <div class="cat-list">

            <button
                class="cat-option"
                data-cat="Lem"
                data-icon="🐈"
                data-personality="Calm"
            >
                <span>🐈</span>
                <strong>Lem</strong>
                <small>Calm</small>
            </button>


            <button
                class="cat-option"
                data-cat="Den"
                data-icon="🐈‍⬛"
                data-personality="Playful"
            >
                <span>🐈‍⬛</span>
                <strong>Den</strong>
                <small>Playful</small>
            </button>


            <button
                class="cat-option"
                data-cat="Cheese"
                data-icon="🐅"
                data-personality="Friendly"
            >
                <span>🐅</span>
                <strong>Cheese</strong>
                <small>Friendly</small>
            </button>

        </div>

        <p id="cat-message">
            Choose a cat to start designing their house!
        </p>

    </section>


        <!-- Furniture Shop -->

        <section class="shop">

            <h2>🛍️ Furniture Shop</h2>

            <div class="furniture-list">

                <!-- Bed -->
                <div
                    class="furniture-item"
                    draggable="true"
                    data-name="Bed"
                    data-price="100"
                    data-happiness="10"
                    data-level="1"
                >
                    <div class="furniture-icon">
                        🛏️
                    </div>

                    <strong>Bed</strong>
                    <p>🪙 100</p>
                    <p>❤️ +10</p>
                </div>


                <!-- Cat Tree -->
                <div
                    class="furniture-item"
                    draggable="true"
                    data-name="Cat Tree"
                    data-price="150"
                    data-happiness="15"
                    data-level="2"
                >
                    <div class="furniture-icon">
                        🌳
                    </div>

                    <strong>Cat Tree</strong>
                    <p>🪙 150</p>
                    <p>❤️ +15</p>
                </div>


                <!-- Toy -->
                <div
                    class="furniture-item"
                    draggable="true"
                    data-name="Toy"
                    data-price="50"
                    data-happiness="5"
                    data-level="1"
                >
                    <div class="furniture-icon">
                        🧶
                    </div>

                    <strong>Toy</strong>
                    <p>🪙 50</p>
                    <p>❤️ +5</p>
                </div>


                <!-- Food Bowl -->
                <div
                    class="furniture-item"
                    draggable="true"
                    data-name="Food Bowl"
                    data-price="80"
                    data-happiness="8"
                    data-level="1"
                >
                    <div class="furniture-icon">
                        🍽️
                    </div>

                    <strong>Food Bowl</strong>
                    <p>🪙 80</p>
                    <p>❤️ +8</p>
                </div>


                <!-- Window -->
                <div
                    class="furniture-item"
                    draggable="true"
                    data-name="Window"
                    data-price="120"
                    data-happiness="12"
                    data-level="2"
                >
                    <div class="furniture-icon">
                        🪟
                    </div>

                    <strong>Window</strong>
                    <p>🪙 120</p>
                    <p>❤️ +12</p>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
